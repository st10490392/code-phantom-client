name: Build and Release Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Accept SDK licences, then install only what Capacitor needs.
      # NOTE: setup-android@v3 `build-tools:` arg pulls the deprecated `tools`
      # package and fails the job — install the components explicitly instead.
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build web assets
        run: |
          mkdir -p dist
          cp index.html manifest.json sw.js voice.js dist/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codephantom-client-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create/Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: stable
          name: CodePhantom Client (Latest)
          body: |
            CodePhantom Client APK - latest build

            Installation:
            1. Download this APK
            2. Open on your Android device
            3. Tap Install (enable Unknown sources if prompted)
            4. Open app and sign in with your licence key
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
