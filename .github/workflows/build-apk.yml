name: Build and Release Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Capacitor CLI v8 requires Node >= 22
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci` installs from package-lock.json only. node_modules is no longer
      # committed (Windows-generated .cmd shims broke `npx cap` on Linux runners).
      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Install cmdline-tools manually.
      # android-actions/setup-android@v3 fails on ubuntu-24.04: it runs
      # `sdkmanager --licenses` against the freshly-downloaded cmdline-tools 16.0,
      # which exits 1 because the legacy `tools` package it requests was retired
      # from Google's repository. Doing it by hand avoids that code path entirely.
      - name: Install Android SDK command-line tools
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf cmdline-tools-extract
          unzip -q cmdline-tools.zip -d cmdline-tools-extract
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools-extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # Capacitor's android/variables.gradle pins compileSdk/targetSdk to 36.
      - name: Install Android platform + build tools
        run: |
          set -euo pipefail
          export PATH="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build web assets
        run: |
          mkdir -p dist
          cp index.html manifest.json sw.js voice.js dist/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codephantom-client-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create/Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: stable
          name: CodePhantom Client (Latest)
          body: |
            CodePhantom Client APK - latest build

            Installation:
            1. Download this APK
            2. Open on your Android device
            3. Tap Install (enable Unknown sources if prompted)
            4. Open app and sign in with your licence key
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
